<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>3D Конструктор портмоне</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--tg-theme-bg-color, #f4f4f6);
      color: var(--tg-theme-text-color, #18181b);
      padding-bottom: 90px;
      overflow-x: hidden;
    }
    #canvas-wrapper {
      position: relative;
      width: 100%;
      height: 310px;
      background: radial-gradient(circle at center, #ffffff 0%, #e4e4e7 100%);
      border-bottom: 1px solid rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #three-canvas {
      width: 100%;
      height: 100%;
      display: block;
      touch-action: none;
    }
    #status-msg {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      background: rgba(220, 38, 38, 0.9);
      color: #fff;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      display: none;
      text-align: center;
      z-index: 10;
    }
    .hint-badge {
      position: absolute;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 11px;
      padding: 4px 12px;
      border-radius: 20px;
      pointer-events: none;
      white-space: nowrap;
    }
    .controls { padding: 16px; }
    .group { margin-bottom: 16px; }
    .label {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      opacity: 0.9;
    }
    .label span.val { font-weight: 400; opacity: 0.7; }
    .colors { display: flex; gap: 12px; flex-wrap: wrap; }
    .color-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.15);
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .color-btn.active {
      transform: scale(1.12);
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
    }
    .options { display: flex; gap: 8px; }
    .opt-btn {
      flex: 1;
      padding: 10px 8px;
      border-radius: 10px;
      border: 1px solid #d4d4d8;
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #18181b);
      font-size: 13px;
      text-align: center;
      cursor: pointer;
    }
    .opt-btn.active {
      border-color: #2563eb;
      background: rgba(37, 99, 235, 0.1);
      font-weight: 600;
    }
    input[type="text"] {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid #d4d4d8;
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #18181b);
      font-size: 14px;
    }
    .price-card {
      margin-top: 12px;
      padding: 12px 16px;
      border-radius: 12px;
      background: var(--tg-theme-secondary-bg-color, #ffffff);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }
    #fallback-btn {
      display: none;
      width: calc(100% - 32px);
      margin: 12px 16px 0;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="canvas-wrapper">
    <div id="status-msg"></div>
    <canvas id="three-canvas"></canvas>
    <div class="hint-badge">Вращайте 1 пальцем • Приближайте 2 пальцами</div>
  </div>

  <div class="controls">
    <div class="group">
      <div class="label">Основная кожа <span class="val" id="val-base">Коньячный</span></div>
      <div class="colors" id="base-colors">
        <div class="color-btn active" style="background:#9c5230" data-name="Коньячный" data-hex="#9c5230"></div>
        <div class="color-btn" style="background:#4a2c18" data-name="Шоколад" data-hex="#4a2c18"></div>
        <div class="color-btn" style="background:#1e2220" data-name="Графит" data-hex="#1e2220"></div>
        <div class="color-btn" style="background:#2b4738" data-name="Изумруд" data-hex="#2b4738"></div>
        <div class="color-btn" style="background:#6e242b" data-name="Бордо" data-hex="#6e242b"></div>
      </div>
    </div>

    <div class="group">
      <div class="label">Внутренние карманы <span class="val" id="val-pocket">В тон</span></div>
      <div class="colors" id="pocket-colors">
        <div class="color-btn active" style="background:#8b4525" data-name="В тон" data-hex="#8b4525"></div>
        <div class="color-btn" style="background:#3a2212" data-name="Шоколад" data-hex="#3a2212"></div>
        <div class="color-btn" style="background:#161918" data-name="Чёрный" data-hex="#161918"></div>
        <div class="color-btn" style="background:#c47a44" data-name="Рыжий виски" data-hex="#c47a44"></div>
      </div>
    </div>

    <div class="group">
      <div class="label">Вощёная нить <span class="val" id="val-thread">Тёмно-коричневая</span></div>
      <div class="colors" id="thread-colors">
        <div class="color-btn active" style="background:#241710" data-name="Тёмно-коричневая" data-hex="#241710"></div>
        <div class="color-btn" style="background:#ebe2cd" data-name="Бежевая" data-hex="#ebe2cd"></div>
        <div class="color-btn" style="background:#d97520" data-name="Рыжая" data-hex="#d97520"></div>
        <div class="color-btn" style="background:#111111" data-name="Чёрная" data-hex="#111111"></div>
        <div class="color-btn" style="background:#b91c1c" data-name="Красная" data-hex="#b91c1c"></div>
      </div>
    </div>

    <div class="group">
      <div class="label">Фурнитура (кнопки)</div>
      <div class="options" id="hw-options">
        <div class="opt-btn active" data-name="Никель" data-hex="#d4d4d8">Никель</div>
        <div class="opt-btn" data-name="Антик" data-hex="#8c6b43">Антик</div>
        <div class="opt-btn" data-name="Чёрный никель" data-hex="#27272a">Тёмный</div>
      </div>
    </div>

    <div class="group">
      <div class="label">Тиснение на обложке (+15 BYN)</div>
      <input type="text" id="emboss-input" maxlength="10" placeholder="Инициалы (например: A.V.)">
    </div>

    <div class="price-card">
      <span>Стоимость изделия:</span>
      <span><span id="price">120</span> BYN</span>
    </div>
  </div>

  <button id="fallback-btn">Оформить заказ (тест в браузере)</button>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const statusMsg = document.getElementById('status-msg');
    function showError(txt) {
      statusMsg.style.display = 'block';
      statusMsg.innerText = txt;
    }

    try {
      const tg = window.Telegram && window.Telegram.WebApp;
      const isTelegram = tg && tg.initData !== "";
      if (tg) tg.expand();

      const state = {
        model: "Портмоне Бифолд (3D)",
        baseLeather: "Коньячный",
        pocketLeather: "В тон",
        thread: "Тёмно-коричневая",
        hardware: "Никель",
        emboss: "",
        basePrice: 120
      };

      function createLeatherBumpTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 256;
        canvas.height = 256;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#808080';
        ctx.fillRect(0, 0, 256, 256);

        for (let i = 0; i < 6500; i++) {
          const x = Math.random() * 256;
          const y = Math.random() * 256;
          const r = Math.random() * 2.2 + 0.5;
          const shade = Math.floor(100 + Math.random() * 65);
          ctx.fillStyle = `rgb(${shade},${shade},${shade})`;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fill();
        }
        const tex = new THREE.CanvasTexture(canvas);
        tex.wrapS = THREE.RepeatWrapping;
        tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(4, 4);
        return tex;
      }

      const container = document.getElementById('canvas-wrapper');
      const canvas = document.getElementById('three-canvas');
      const scene = new THREE.Scene();

      const width = container.clientWidth || window.innerWidth || 360;
      const height = container.clientHeight || 310;

      const camera = new THREE.PerspectiveCamera(40, width / height, 0.1, 100);
      camera.position.set(0, 1.8, 5.2);

      const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.07;
      controls.minDistance = 2.8;
      controls.maxDistance = 8.5;

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
      dirLight.position.set(3, 5, 4);
      scene.add(dirLight);

      const backLight = new THREE.DirectionalLight(0xfff5e6, 0.6);
      backLight.position.set(-4, 2, -4);
      scene.add(backLight);

      const bumpTex = createLeatherBumpTexture();

      const baseLeatherMat = new THREE.MeshStandardMaterial({
        color: 0x9c5230,
        roughness: 0.62,
        metalness: 0.05,
        bumpMap: bumpTex,
        bumpScale: 0.015
      });

      const pocketLeatherMat = new THREE.MeshStandardMaterial({
        color: 0x8b4525,
        roughness: 0.65,
        metalness: 0.04,
        bumpMap: bumpTex,
        bumpScale: 0.015
      });

      const threadMat = new THREE.MeshStandardMaterial({
        color: 0x241710,
        roughness: 0.5
      });

      const hardwareMat = new THREE.MeshStandardMaterial({
        color: 0xd4d4d8,
        roughness: 0.25,
        metalness: 0.88
      });

      const walletGroup = new THREE.Group();
      scene.add(walletGroup);

      function createLeatherPanel(w, h, depth, r, mat) {
        const shape = new THREE.Shape();
        const x = -w / 2, y = -h / 2;
        shape.moveTo(x + r, y);
        shape.lineTo(x + w - r, y);
        shape.quadraticCurveTo(x + w, y, x + w, y + r);
        shape.lineTo(x + w, y + h - r);
        shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        shape.lineTo(x + r, y + h);
        shape.quadraticCurveTo(x, y + h, x, y + h - r);
        shape.lineTo(x, y + r);
        shape.quadraticCurveTo(x, y, x + r, y);

        const geom = new THREE.ExtrudeGeometry(shape, {
          depth: depth,
          bevelEnabled: true,
          bevelSegments: 2,
          steps: 1,
          bevelSize: 0.012,
          bevelThickness: 0.012
        });
        return new THREE.Mesh(geom, mat);
      }

      function addStitchLine(parent, x1, y1, x2, y2, z) {
        const dist = Math.hypot(x2 - x1, y2 - y1);
        const step = 0.065;
        const count = Math.floor(dist / step);
        const angle = Math.atan2(y2 - y1, x2 - x1);
        const stitchGeom = new THREE.BoxGeometry(0.038, 0.014, 0.016);

        for (let i = 0; i <= count; i++) {
          const t = i / count;
          const mesh = new THREE.Mesh(stitchGeom, threadMat);
          mesh.position.set(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, z);
          mesh.rotation.z = angle + 0.25;
          parent.add(mesh);
        }
      }

      const leftWing = new THREE.Group();
      const rightWing = new THREE.Group();
      leftWing.position.set(-0.08, 0, 0);
      rightWing.position.set(0.08, 0, 0);
      leftWing.rotation.y = 0.36;
      rightWing.rotation.y = -0.36;
      walletGroup.add(leftWing, rightWing);

      const spineGeom = new THREE.CylinderGeometry(0.16, 0.16, 1.9, 16, 1, true, Math.PI * 0.65, Math.PI * 0.7);
      const spineMesh = new THREE.Mesh(spineGeom, baseLeatherMat);
      spineMesh.position.set(0, 0, -0.09);
      walletGroup.add(spineMesh);

      const leftBase = createLeatherPanel(1.55, 1.9, 0.035, 0.1, baseLeatherMat);
      leftBase.position.set(-0.77, 0, 0);
      leftWing.add(leftBase);

      for (let i = 0; i < 3; i++) {
        const pHeight = 1.35 - i * 0.28;
        const pocket = createLeatherPanel(1.48, pHeight, 0.028, 0.06, pocketLeatherMat);
        pocket.position.set(-0.76, -0.95 + pHeight / 2 + 0.02, 0.03 + i * 0.022);
        leftWing.add(pocket);
      }

      const snapTop = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 0.025, 20), hardwareMat);
      snapTop.rotation.x = Math.PI / 2;
      snapTop.position.set(-1.15, 0.68, 0.055);
      leftWing.add(snapTop);

      addStitchLine(leftWing, -1.46, -0.86, -0.05, -0.86, 0.095);
      addStitchLine(leftWing, -1.46, 0.86, -0.05, 0.86, 0.055);
      addStitchLine(leftWing, -1.46, -0.86, -1.46, 0.86, 0.095);

      const rightBase = createLeatherPanel(1.55, 1.9, 0.035, 0.1, baseLeatherMat);
      rightBase.position.set(0.77, 0, 0);
      rightWing.add(rightBase);

      const coinBox = createLeatherPanel(1.32, 1.15, 0.11, 0.07, pocketLeatherMat);
      coinBox.position.set(0.77, -0.25, 0.04);
      rightWing.add(coinBox);

      const coinFlap = createLeatherPanel(1.34, 0.52, 0.03, 0.08, baseLeatherMat);
      coinFlap.position.set(0.77, 0.14, 0.165);
      rightWing.add(coinFlap);

      const snapCoin = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.025, 20), hardwareMat);
      snapCoin.rotation.x = Math.PI / 2;
      snapCoin.position.set(0.77, 0.0, 0.21);
      rightWing.add(snapCoin);

      const strap = createLeatherPanel(0.38, 0.34, 0.035, 0.12, baseLeatherMat);
      strap.position.set(0.77, -0.82, 0.16);
      rightWing.add(strap);

      const snapStrap = new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.025, 20), hardwareMat);
      snapStrap.rotation.x = Math.PI / 2;
      snapStrap.position.set(0.77, -0.78, 0.21);
      rightWing.add(snapStrap);

      addStitchLine(rightWing, 0.05, -0.86, 1.46, -0.86, 0.055);
      addStitchLine(rightWing, 0.05, 0.86, 1.46, 0.86, 0.055);
      addStitchLine(rightWing, 1.46, -0.86, 1.46, 0.86, 0.055);
      addStitchLine(rightWing, 0.18, 0.34, 1.36, 0.34, 0.205);

      const embossCanvas = document.createElement('canvas');
      embossCanvas.width = 512;
      embossCanvas.height = 128;
      const embossCtx = embossCanvas.getContext('2d');
      const embossTex = new THREE.CanvasTexture(embossCanvas);
      const embossPlane = new THREE.Mesh(
        new THREE.PlaneGeometry(1.1, 0.28),
        new THREE.MeshBasicMaterial({ map: embossTex, transparent: true })
      );
      embossPlane.position.set(0.82, -0.62, -0.016);
      embossPlane.rotation.y = Math.PI;
      rightWing.add(embossPlane);

      function updateEmbossTexture(text) {
        embossCtx.clearRect(0, 0, 512, 128);
        if (text.trim()) {
          embossCtx.font = "bold 54px sans-serif";
          embossCtx.fillStyle = "rgba(20, 10, 5, 0.55)";
          embossCtx.textAlign = "right";
          embossCtx.fillText(text.toUpperCase(), 490, 82);
        }
        embossTex.needsUpdate = true;
      }

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      }
      animate();

      window.addEventListener('resize', () => {
        const w = container.clientWidth || window.innerWidth;
        const h = container.clientHeight || 310;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
      });

      function updatePrice() {
        const total = state.basePrice + (state.emboss.trim() ? 15 : 0);
        document.getElementById("price").innerText = total;
        if (isTelegram) {
          tg.MainButton.setText(`ОФОРМИТЬ ЗАКАЗ • ${total} BYN`);
        }
      }

      document.querySelectorAll("#base-colors .color-btn").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll("#base-colors .color-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.baseLeather = btn.dataset.name;
          document.getElementById("val-base").innerText = btn.dataset.name;
          baseLeatherMat.color.set(btn.dataset.hex);
        };
      });

      document.querySelectorAll("#pocket-colors .color-btn").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll("#pocket-colors .color-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.pocketLeather = btn.dataset.name;
          document.getElementById("val-pocket").innerText = btn.dataset.name;
          pocketLeatherMat.color.set(btn.dataset.hex);
        };
      });

      document.querySelectorAll("#thread-colors .color-btn").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll("#thread-colors .color-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.thread = btn.dataset.name;
          document.getElementById("val-thread").innerText = btn.dataset.name;
          threadMat.color.set(btn.dataset.hex);
        };
      });

      document.querySelectorAll("#hw-options .opt-btn").forEach(btn => {
        btn.onclick = () => {
          document.querySelectorAll("#hw-options .opt-btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          state.hardware = btn.dataset.name;
          hardwareMat.color.set(btn.dataset.hex);
        };
      });

      document.getElementById("emboss-input").oninput = (e) => {
        state.emboss = e.target.value;
        updateEmbossTexture(state.emboss);
        updatePrice();
      };

      function submitOrder() {
        const total = state.basePrice + (state.emboss.trim() ? 15 : 0);
        const orderData = { ...state, totalPrice: total };
        if (isTelegram) {
          tg.sendData(JSON.stringify(orderData));
        } else {
          alert("Данные заказа для отправки боту:\n\n" + JSON.stringify(orderData, null, 2));
        }
      }

      if (isTelegram) {
        tg.MainButton.show();
        updatePrice();
        tg.MainButton.onClick(submitOrder);
      } else {
        const fb = document.getElementById("fallback-btn");
        fb.style.display = "block";
        fb.onclick = submitOrder;
      }
    } catch (err) {
      showError("Ошибка запуска 3D: " + err.message);
    }
  </script>
</body>
</html>
