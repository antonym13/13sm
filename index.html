<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D Конструктор картхолдера</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    :root {
      --bg: #141416;
      --card: #1e1e22;
      --border: #2e2e34;
      --text: #f3f3f5;
      --muted: #9898a0;
      --accent: #c87d4b;
      --accent-hover: #d98c59;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }

    header { padding: 14px 16px 8px; text-align: center; }
    header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.2px; }
    header p { font-size: 12px; color: var(--muted); margin-top: 3px; }

    #canvas-wrap {
      position: relative;
      width: 100%;
      height: 290px;
      background: radial-gradient(circle at center, #25252b 0%, #141416 75%);
      touch-action: none;
    }
    .view-btns {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      background: rgba(20, 20, 22, 0.8);
      padding: 4px;
      border-radius: 20px;
      border: 1px solid var(--border);
      backdrop-filter: blur(6px);
    }
    .view-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .view-btn.active { background: var(--accent); color: #fff; }

    .controls { padding: 14px 16px 100px; display: flex; flex-direction: column; gap: 16px; max-width: 520px; width: 100%; margin: 0 auto; }
    .section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; }
    .section-title { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; }
    .section-title span { color: var(--text); }

    .colors { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .color-swatch {
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s;
    }
    .color-swatch.active { border-color: #fff; transform: scale(1.1); box-shadow: 0 0 0 2px var(--accent); }

    .side-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--bg); padding: 4px; border-radius: 10px; margin-bottom: 12px; }
    .side-tab {
      background: transparent; border: none; color: var(--muted); padding: 8px; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .side-tab.active { background: var(--card); color: var(--text); box-shadow: 0 2px 6px rgba(0,0,0,0.3); }

    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .opt-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 8px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: 0.15s;
    }
    .opt-btn.active { border-color: var(--accent); background: rgba(200, 125, 75, 0.15); color: #fff; font-weight: 600; }

    .engraving-row { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .engraving-row label { font-size: 14px; font-weight: 500; cursor: pointer; }
    .engraving-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
    #engraving-input-wrap { margin-top: 10px; display: none; }
    #engraving-text {
      width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 10px 12px; border-radius: 10px; font-size: 14px; text-transform: uppercase; letter-spacing: 2px;
    }
    #engraving-text:focus { outline: none; border-color: var(--accent); }

    .footer-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(20, 20, 22, 0.95);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      backdrop-filter: blur(10px);
      z-index: 20;
    }
    .price-box { display: flex; flex-direction: column; }
    .price-label { font-size: 11px; color: var(--muted); }
    .price-val { font-size: 18px; font-weight: 700; color: #fff; }
    .order-btn {
      flex: 1; max-width: 240px;
      background: var(--accent); color: #fff; border: none; padding: 13px 18px;
      border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .order-btn:hover { background: var(--accent-hover); }
  </style>
</head>
<body>

  <header>
    <h1>3D Конструктор картхолдера</h1>
    <p>Размер 100×100 мм • Вращайте 1 пальцем</p>
  </header>

  <div id="canvas-wrap">
    <div class="view-btns">
      <button class="view-btn active" id="btn-front" onclick="setCameraSide('front')">Спереди</button>
      <button class="view-btn" id="btn-back" onclick="setCameraSide('back')">Сзади</button>
    </div>
  </div>

  <div class="controls">
    <div class="section">
      <div class="section-title">Цвет кожи (нить в тон) <span id="color-name">Коньячный</span></div>
      <div class="colors" id="color-list"></div>
    </div>

    <div class="section">
      <div class="section-title">Конфигурация сторон <span id="active-side-label">Спереди</span></div>
      <div class="side-tabs">
        <button class="side-tab active" id="tab-front" onclick="selectSideTab('front')">Лицевая сторона</button>
        <button class="side-tab" id="tab-back" onclick="selectSideTab('back')">Оборотная сторона</button>
      </div>
      <div class="options-grid" id="side-options">
        <button class="opt-btn" data-val="2" onclick="setSideType('2')">2 кармана</button>
        <button class="opt-btn" data-val="3" onclick="setSideType('3')">3 кармана</button>
        <button class="opt-btn" data-val="4" onclick="setSideType('4')">4 кармана</button>
        <button class="opt-btn" data-val="coin" onclick="setSideType('coin')">Монетница</button>
      </div>
    </div>

    <div class="section">
      <div class="engraving-row" onclick="toggleEngraving()">
        <label for="engraving-check">Лазерная гравировка инициалов (+10 BYN)</label>
        <input type="checkbox" id="engraving-check" onclick="event.stopPropagation(); toggleEngraving();" />
      </div>
      <div id="engraving-input-wrap">
        <input type="text" id="engraving-text" maxlength="5" placeholder="Например: A.M." oninput="updateEngravingText()" />
      </div>
    </div>
  </div>

  <div class="footer-bar">
    <div class="price-box">
      <span class="price-label">Стоимость изделия</span>
      <span class="price-val" id="total-price">85 BYN</span>
    </div>
    <button class="order-btn" onclick="submitOrder()">Оформить заказ</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const COLORS = [
      { id: 'cognac', name: 'Коньячный', hex: '#9e5328', thread: '#753917', burn: '#3b1906' },
      { id: 'black', name: 'Чёрный', hex: '#232326', thread: '#111113', burn: '#080809' },
      { id: 'chocolate', name: 'Тёмный шоколад', hex: '#4a2c1d', thread: '#331c11', burn: '#1c0d06' },
      { id: 'olive', name: 'Оливковый', hex: '#4d5738', thread: '#353d25', burn: '#1e2413' },
      { id: 'natural', name: 'Натуральный', hex: '#cfa578', thread: '#a88156', burn: '#5e3c19' },
      { id: 'burgundy', name: 'Бургунди', hex: '#6e232c', thread: '#4d141b', burn: '#29070b' }
    ];

    const state = {
      color: COLORS[0],
      activeTab: 'front',
      frontType: '2',
      backType: '2',
      engraving: false,
      engravingText: '',
      basePrice: 85
    };

    const colorListEl = document.getElementById('color-list');
    COLORS.forEach(c => {
      const btn = document.createElement('div');
      btn.className = 'color-swatch' + (c.id === state.color.id ? ' active' : '');
      btn.style.backgroundColor = c.hex;
      btn.onclick = () => {
        state.color = c;
        document.getElementById('color-name').textContent = c.name;
        document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('active'));
        btn.classList.add('active');
        rebuildModel();
      };
      colorListEl.appendChild(btn);
    });

    const wrap = document.getElementById('canvas-wrap');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(36, wrap.clientWidth / wrap.clientHeight, 0.1, 100);
    camera.position.set(0, 0.3, 6.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    wrap.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enablePan = false;
    controls.minDistance = 4.2;
    controls.maxDistance = 8.5;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
    scene.add(ambientLight);
    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.85);
    dirLight1.position.set(4, 6, 5);
    scene.add(dirLight1);
    const dirLight2 = new THREE.DirectionalLight(0xffe8d6, 0.45);
    dirLight2.position.set(-4, -3, -5);
    scene.add(dirLight2);

    const holderGroup = new THREE.Group();
    scene.add(holderGroup);

    function createRoundedRectShape(w, h, r) {
      const shape = new THREE.Shape();
      const x = -w / 2, y = -h / 2;
      shape.moveTo(x + r, y);
      shape.lineTo(x + w - r, y);
      shape.quadraticCurveTo(x + w, y, x + w, y + r);
      shape.lineTo(x + w, y + h - r);
      shape.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      shape.lineTo(x + r, y + h);
      shape.quadraticCurveTo(x, y + h, x, y + h - r);
      shape.lineTo(x, y + r);
      shape.quadraticCurveTo(x, y, x + r, y);
      return shape;
    }

    function createLeatherTexture(baseHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 4500; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.05)';
        ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    function buildSideLayer(type, isFront, leatherMat, threadMat) {
      const sideGroup = new THREE.Group();
      const dir = isFront ? 1 : -1;
      const baseZ = dir * 0.045;
      const size = 2.6;
      const radius = 0.22;

      if (type === 'coin') {
        const bodyShape = createRoundedRectShape(size, size * 0.88, radius);
        const bodyGeo = new THREE.ExtrudeGeometry(bodyShape, { depth: 0.04, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.008, bevelSegments: 2 });
        const bodyMesh = new THREE.Mesh(bodyGeo, leatherMat);
        bodyMesh.position.set(0, -size * 0.06, isFront ? baseZ : baseZ - 0.04);
        sideGroup.add(bodyMesh);

        const flapShape = new THREE.Shape();
        const fw = size * 0.96, fh = size * 0.46;
        flapShape.moveTo(-fw / 2, fh / 2);
        flapShape.lineTo(fw / 2, fh / 2);
        flapShape.lineTo(fw / 2, -fh * 0.1);
        flapShape.quadraticCurveTo(0, -fh * 0.75, -fw / 2, -fh * 0.1);
        flapShape.closePath();

        const flapGeo = new THREE.ExtrudeGeometry(flapShape, { depth: 0.035, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.008, bevelSegments: 2 });
        const flapMesh = new THREE.Mesh(flapGeo, leatherMat);
        flapMesh.position.set(0, size * 0.27, isFront ? baseZ + 0.045 : baseZ - 0.08);
        sideGroup.add(flapMesh);

        const snapGeo = new THREE.CylinderGeometry(0.11, 0.11, 0.02, 24);
        snapGeo.rotateX(Math.PI / 2);
        const snapMat = new THREE.MeshStandardMaterial({ color: 0x3a3a40, metalness: 0.75, roughness: 0.3 });
        const snapMesh = new THREE.Mesh(snapGeo, snapMat);
        snapMesh.position.set(0, size * 0.08, isFront ? baseZ + 0.085 : baseZ - 0.085);
        sideGroup.add(snapMesh);
      } else {
        const count = parseInt(type, 10);
        for (let i = 0; i < count; i++) {
          const h = size * (0.76 - i * (0.36 / count));
          const yOffset = -(size - h) / 2;
          const zStep = i * 0.028;

          const pShape = createRoundedRectShape(size, h, radius);
          const pGeo = new THREE.ExtrudeGeometry(pShape, {
            depth: 0.026,
            bevelEnabled: true,
            bevelThickness: 0.006,
            bevelSize: 0.006,
            bevelSegments: 2
          });
          const pMesh = new THREE.Mesh(pGeo, leatherMat);
          pMesh.position.set(0, yOffset, isFront ? baseZ + zStep : baseZ - zStep - 0.026);
          sideGroup.add(pMesh);

          const stitchGeo = new THREE.BoxGeometry(size - 0.18, 0.014, 0.008);
          const stitchMesh = new THREE.Mesh(stitchGeo, threadMat);
          stitchMesh.position.set(0, yOffset + h / 2 - 0.07, isFront ? baseZ + zStep + 0.032 : baseZ - zStep - 0.032);
          sideGroup.add(stitchMesh);
        }
      }

      const borderStitchGeo = new THREE.EdgesGeometry(new THREE.BoxGeometry(size - 0.14, size - 0.14, 0.01));
      const borderLine = new THREE.LineSegments(borderStitchGeo, new THREE.LineBasicMaterial({ color: state.color.thread }));
      borderLine.position.set(0, 0, isFront ? baseZ + 0.035 : baseZ - 0.035);
      sideGroup.add(borderLine);

      return sideGroup;
    }

    function buildEngravingMesh() {
      if (!state.engraving || !state.engravingText.trim()) return null;
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 512, 128);
      ctx.font = 'bold 54px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = state.color.burn;
      ctx.fillText(state.engravingText.trim().toUpperCase(), 256, 64);

      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
      const geo = new THREE.PlaneGeometry(1.4, 0.35);
      const mesh = new THREE.Mesh(geo, mat);

      const yPos = state.frontType === 'coin' ? 0.65 : -0.88;
      const zPos = state.frontType === 'coin' ? 0.135 : 0.045 + parseInt(state.frontType, 10) * 0.028 + 0.01;
      mesh.position.set(0, yPos, zPos);
      return mesh;
    }

    function rebuildModel() {
      while (holderGroup.children.length > 0) {
        holderGroup.remove(holderGroup.children[0]);
      }

      const tex = createLeatherTexture(state.color.hex);
      const leatherMat = new THREE.MeshStandardMaterial({
        map: tex,
        roughness: 0.62,
        metalness: 0.05
      });
      const threadMat = new THREE.MeshStandardMaterial({ color: state.color.thread, roughness: 0.8 });

      const coreShape = createRoundedRectShape(2.6, 2.6, 0.22);
      const coreGeo = new THREE.ExtrudeGeometry(coreShape, { depth: 0.08, bevelEnabled: true, bevelThickness: 0.01, bevelSize: 0.01, bevelSegments: 2 });
      coreGeo.center();
      const coreMesh = new THREE.Mesh(coreGeo, leatherMat);
      holderGroup.add(coreMesh);

      holderGroup.add(buildSideLayer(state.frontType, true, leatherMat, threadMat));
      holderGroup.add(buildSideLayer(state.backType, false, leatherMat, threadMat));

      const engMesh = buildEngravingMesh();
      if (engMesh) holderGroup.add(engMesh);

      updateUIState();
    }

    let targetAngleY = 0;
    let isAnimatingCamera = false;

    function setCameraSide(side) {
      document.getElementById('btn-front').classList.toggle('active', side === 'front');
      document.getElementById('btn-back').classList.toggle('active', side === 'back');
      selectSideTab(side, false);
      targetAngleY = side === 'front' ? 0 : Math.PI;
      isAnimatingCamera = true;
    }

    function selectSideTab(side, rotateCam = true) {
      state.activeTab = side;
      document.getElementById('tab-front').classList.toggle('active', side === 'front');
      document.getElementById('tab-back').classList.toggle('active', side === 'back');
      document.getElementById('active-side-label').textContent = side === 'front' ? 'Спереди' : 'Сзади';
      updateUIState();
      if (rotateCam) {
        document.getElementById('btn-front').classList.toggle('active', side === 'front');
        document.getElementById('btn-back').classList.toggle('active', side === 'back');
        targetAngleY = side === 'front' ? 0 : Math.PI;
        isAnimatingCamera = true;
      }
    }

    function setSideType(val) {
      if (state.activeTab === 'front') state.frontType = val;
      else state.backType = val;
      rebuildModel();
    }

    function toggleEngraving() {
      const cb = document.getElementById('engraving-check');
      state.engraving = cb.checked;
      document.getElementById('engraving-input-wrap').style.display = state.engraving ? 'block' : 'none';
      if (state.engraving) {
        setCameraSide('front');
        document.getElementById('engraving-text').focus();
      }
      rebuildModel();
    }

    function updateEngravingText() {
      state.engravingText = document.getElementById('engraving-text').value;
      rebuildModel();
    }

    function calculatePrice() {
      let price = state.basePrice;
      const sideCost = (t) => (t === 'coin' ? 15 : t === '4' ? 10 : t === '3' ? 5 : 0);
      price += sideCost(state.frontType) + sideCost(state.backType);
      if (state.engraving) price += 10;
      return price;
    }

    function updateUIState() {
      const currentVal = state.activeTab === 'front' ? state.frontType : state.backType;
      document.querySelectorAll('.opt-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.val === currentVal);
      });
      document.getElementById('total-price').textContent = calculatePrice() + ' BYN';
    }

    function submitOrder() {
      const formatSide = (t) => (t === 'coin' ? 'Монетница' : `${t} кармана`);
      const price = calculatePrice();
      const engInfo = state.engraving && state.engravingText.trim()
        ? `Да («${state.engravingText.trim().toUpperCase()}»)`
        : 'Нет';

      const summary = [
        'Новый заказ: Картхолдер (100×100 мм)',
        `• Цвет кожи (нить в тон): ${state.color.name}`,
        `• Спереди: ${formatSide(state.frontType)}`,
        `• Сзади: ${formatSide(state.backType)}`,
        `• Гравировка: ${engInfo}`,
        `• Итого: ${price} BYN`
      ].join('\n');

      if (tg && tg.initData) {
        tg.sendData(JSON.stringify({
          product: 'cardholder_100x100',
          color: state.color.name,
          front: state.frontType,
          back: state.backType,
          engraving: state.engraving ? state.engravingText.trim().toUpperCase() : '',
          price: price
        }));
      } else {
        alert(summary);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      if (isAnimatingCamera) {
        const currentY = holderGroup.rotation.y;
        const diff = targetAngleY - currentY;
        if (Math.abs(diff) < 0.02) {
          holderGroup.rotation.y = targetAngleY;
          isAnimatingCamera = false;
        } else {
          holderGroup.rotation.y += diff * 0.14;
        }
      }
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = wrap.clientWidth / wrap.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    });

    rebuildModel();
    animate();
  </script>
</body>
</html>
