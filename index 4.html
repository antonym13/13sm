<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>3D Конструктор картхолдера</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    :root {
      --bg: #141416;
      --card: #1e1e22;
      --border: #2e2e34;
      --text: #f3f3f5;
      --muted: #9898a0;
      --accent: #c87d4b;
      --accent-hover: #d98c59;
      --canvas-bg: radial-gradient(circle at center, #25252b 0%, #141416 75%);
      --footer-bg: rgba(20, 20, 22, 0.95);
      --pill-bg: rgba(20, 20, 22, 0.82);
    }

    body.light-theme {
      --bg: #f4f4f6;
      --card: #ffffff;
      --border: #dfe0e5;
      --text: #18181b;
      --muted: #6e6e77;
      --accent: #b86b38;
      --accent-hover: #a35a2a;
      --canvas-bg: radial-gradient(circle at center, #ffffff 0%, #e6e7ec 80%);
      --footer-bg: rgba(255, 255, 255, 0.95);
      --pill-bg: rgba(255, 255, 255, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; transition: background 0.25s, color 0.25s; }

    header {
      padding: 14px 16px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
    }
    .header-titles { text-align: left; }
    header h1 { font-size: 17px; font-weight: 700; letter-spacing: -0.2px; }
    header p { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .theme-toggle {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.2s;
      flex-shrink: 0;
    }

    #canvas-wrap {
      position: relative;
      width: 100%;
      height: 290px;
      background: var(--canvas-bg);
      touch-action: none;
    }
    .view-btns {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 6px;
      background: var(--pill-bg);
      padding: 4px;
      border-radius: 20px;
      border: 1px solid var(--border);
      backdrop-filter: blur(6px);
    }
    .view-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      padding: 6px 16px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .view-btn.active { background: var(--accent); color: #fff; }

    .controls { padding: 14px 16px 100px; display: flex; flex-direction: column; gap: 14px; max-width: 520px; width: 100%; margin: 0 auto; }
    .section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 14px; transition: background 0.25s, border-color 0.25s; }
    .section-title { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 10px; display: flex; justify-content: space-between; }
    .section-title span { color: var(--text); }

    .colors { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .color-swatch {
      aspect-ratio: 1;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      position: relative;
      transition: transform 0.15s;
    }
    .color-swatch.active { border-color: var(--card); transform: scale(1.1); box-shadow: 0 0 0 2px var(--accent); }

    .side-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--bg); padding: 4px; border-radius: 10px; margin-bottom: 12px; }
    .side-tab {
      background: transparent; border: none; color: var(--muted); padding: 8px; border-radius: 8px;
      font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .side-tab.active { background: var(--card); color: var(--text); box-shadow: 0 2px 6px rgba(0,0,0,0.12); }

    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .opt-btn, .corner-btn {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 8px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
      transition: 0.15s;
    }
    .opt-btn.active, .corner-btn.active {
      border-color: var(--accent);
      background: rgba(200, 125, 75, 0.15);
      color: var(--text);
      font-weight: 600;
    }

    .engraving-row { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .engraving-row label { font-size: 14px; font-weight: 500; cursor: pointer; }
    .engraving-row input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }
    #engraving-input-wrap { margin-top: 10px; display: none; }
    #engraving-text {
      width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text);
      padding: 10px 12px; border-radius: 10px; font-size: 14px; text-transform: uppercase; letter-spacing: 2px;
    }
    #engraving-text:focus { outline: none; border-color: var(--accent); }

    .footer-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--footer-bg);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      backdrop-filter: blur(10px);
      z-index: 20;
    }
    .price-box { display: flex; flex-direction: column; }
    .price-label { font-size: 11px; color: var(--muted); }
    .price-val { font-size: 18px; font-weight: 700; color: var(--text); }
    .order-btn {
      flex: 1; max-width: 240px;
      background: var(--accent); color: #fff; border: none; padding: 13px 18px;
      border-radius: 12px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .order-btn:hover { background: var(--accent-hover); }
  </style>
</head>
<body>

  <header>
    <div class="header-titles">
      <h1>3D Конструктор картхолдера</h1>
      <p>100×100 мм • Вращайте 1 пальцем</p>
    </div>
    <button class="theme-toggle" id="theme-btn" onclick="toggleTheme()">☀️ Светлая</button>
  </header>

  <div id="canvas-wrap">
    <div class="view-btns">
      <button class="view-btn active" id="btn-front" onclick="setCameraSide('front')">Спереди</button>
      <button class="view-btn" id="btn-back" onclick="setCameraSide('back')">Сзади</button>
    </div>
  </div>

  <div class="controls">
    <!-- Цвет кожи -->
    <div class="section">
      <div class="section-title">Цвет кожи (нить в тон) <span id="color-name">Коньячный</span></div>
      <div class="colors" id="color-list"></div>
    </div>

    <!-- Форма углов -->
    <div class="section">
      <div class="section-title">Форма углов <span id="corner-label">Скруглённые (10 мм)</span></div>
      <div class="options-grid">
        <button class="corner-btn" data-corner="sharp" onclick="setCornerStyle('sharp')">Прямые (2 мм)</button>
        <button class="corner-btn active" data-corner="round" onclick="setCornerStyle('round')">Скруглённые (10 мм)</button>
      </div>
    </div>

    <!-- Настройка сторон -->
    <div class="section">
      <div class="section-title">Конфигурация сторон <span id="active-side-label">Спереди</span></div>
      <div class="side-tabs">
        <button class="side-tab active" id="tab-front" onclick="selectSideTab('front')">Лицевая сторона</button>
        <button class="side-tab" id="tab-back" onclick="selectSideTab('back')">Оборотная сторона</button>
      </div>
      <div class="options-grid" id="side-options">
        <button class="opt-btn" data-val="2" onclick="setSideType('2')">2 кармана</button>
        <button class="opt-btn" data-val="3" onclick="setSideType('3')">3 кармана</button>
        <button class="opt-btn" data-val="4" onclick="setSideType('4')">4 кармана</button>
        <button class="opt-btn" data-val="coin" onclick="setSideType('coin')">Монетница</button>
      </div>
    </div>

    <!-- Гравировка -->
    <div class="section">
      <div class="engraving-row" onclick="toggleEngraving()">
        <label for="engraving-check">Лазерная гравировка инициалов (+10 BYN)</label>
        <input type="checkbox" id="engraving-check" onclick="event.stopPropagation(); toggleEngraving();" />
      </div>
      <div id="engraving-input-wrap">
        <input type="text" id="engraving-text" maxlength="5" placeholder="Например: A.M." oninput="updateEngravingText()" />
      </div>
    </div>
  </div>

  <div class="footer-bar">
    <div class="price-box">
      <span class="price-label">Стоимость изделия</span>
      <span class="price-val" id="total-price">85 BYN</span>
    </div>
    <button class="order-btn" onclick="submitOrder()">Оформить заказ</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const COLORS = [
      { id: 'cognac', name: 'Коньячный', hex: '#9e5328', thread: '#703412', burn: '#3b1906' },
      { id: 'black', name: 'Чёрный', hex: '#232326', thread: '#45454d', burn: '#080809' },
      { id: 'chocolate', name: 'Тёмный шоколад', hex: '#4a2c1d', thread: '#2b160c', burn: '#1c0d06' },
      { id: 'olive', name: 'Оливковый', hex: '#4d5738', thread: '#2f3620', burn: '#1e2413' },
      { id: 'natural', name: 'Натуральный', hex: '#cfa578', thread: '#9c7346', burn: '#5e3c19' },
      { id: 'burgundy', name: 'Бургунди', hex: '#6e232c', thread: '#421016', burn: '#29070b' }
    ];

    // Масштаб сцены: 100 мм = 2.6 юнита => 1 мм = 0.026 юнита
    const MM = 0.026;

    const state = {
      theme: 'dark',
      color: COLORS[0],
      cornerStyle: 'round', // 'sharp' (2 мм) | 'round' (10 мм)
      activeTab: 'front',
      frontType: '2',
      backType: '2',
      engraving: false,
      engravingText: '',
      basePrice: 85
    };

    function toggleTheme() {
      state.theme = state.theme === 'dark' ? 'light' : 'dark';
      document.body.classList.toggle('light-theme', state.theme === 'light');
      document.getElementById('theme-btn').textContent = state.theme === 'dark' ? '☀️ Светлая' : '🌙 Тёмная';
    }

    const colorListEl = document.getElementById('color-list');
    COLORS.forEach(c => {
      const btn = document.createElement('div');
      btn.className = 'color-swatch' + (c.id === state.color.id ? ' active' : '');
      btn.style.backgroundColor = c.hex;
      btn.onclick = () => {
        state.color = c;
        document.getElementById('color-name').textContent = c.name;
        document.querySelectorAll('.color-swatch').forEach(el => el.classList.remove('active'));
        btn.classList.add('active');
        rebuildModel();
      };
      colorListEl.appendChild(btn);
    });

    const wrap = document.getElementById('canvas-wrap');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(36, wrap.clientWidth / wrap.clientHeight, 0.1, 100);
    camera.position.set(0, 0.3, 6.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    wrap.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enablePan = false;
    controls.minDistance = 4.2;
    controls.maxDistance = 8.5;

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.68);
    scene.add(ambientLight);
    const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.85);
    dirLight1.position.set(4, 6, 5);
    scene.add(dirLight1);
    const dirLight2 = new THREE.DirectionalLight(0xffe8d6, 0.45);
    dirLight2.position.set(-4, -3, -5);
    scene.add(dirLight2);

    const holderGroup = new THREE.Group();
    scene.add(holderGroup);

    // Скругленный прямоугольник с точным радиусом в юнитах
    function createRoundedRectShape(w, h, r) {
      const shape = new THREE.Shape();
      const x = -w / 2, y = -h / 2;
      const safeR = Math.min(r, w / 2 - 0.001, h / 2 - 0.001);
      shape.moveTo(x + safeR, y);
      shape.lineTo(x + w - safeR, y);
      shape.quadraticCurveTo(x + w, y, x + w, y + safeR);
      shape.lineTo(x + w, y + h - safeR);
      shape.quadraticCurveTo(x + w, y + h, x + w - safeR, y + h);
      shape.lineTo(x + safeR, y + h);
      shape.quadraticCurveTo(x, y + h, x, y + h - safeR);
      shape.lineTo(x, y + safeR);
      shape.quadraticCurveTo(x, y, x + safeR, y);
      return shape;
    }

    // Текстура кожи
    function createLeatherTexture(baseHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, 256, 256);
      for (let i = 0; i < 4500; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.03)' : 'rgba(0,0,0,0.05)';
        ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      return tex;
    }

    // Генерация объемной штриховой линии шва шириной 1 мм вдоль массива 2D-точек
    function createDashedStitchMesh(points, zPos, dir, threadMat) {
      const stitchGroup = new THREE.Group();
      const stitchWidth = 1.0 * MM;   // ширина шва 1 мм
      const dashLen = 3.2 * MM;       // длина стежка
      const gapLen = 1.6 * MM;        // промежуток между стежками
      const stepPeriod = dashLen + gapLen;
      const stitchThick = 0.008;

      let accumDist = 0;
      for (let i = 0; i < points.length - 1; i++) {
        const p1 = points[i];
        const p2 = points[i + 1];
        const dx = p2.x - p1.x;
        const dy = p2.y - p1.y;
        const segLen = Math.hypot(dx, dy);
        if (segLen < 0.0001) continue;

        const angle = Math.atan2(dy, dx);
        let posAlongSeg = 0;

        while (posAlongSeg < segLen) {
          const cyclePos = accumDist % stepPeriod;
          const remainingInSeg = segLen - posAlongSeg;

          if (cyclePos < dashLen) {
            const drawLen = Math.min(dashLen - cyclePos, remainingInSeg);
            if (drawLen > 0.005) {
              const midOffset = posAlongSeg + drawLen / 2;
              const t = midOffset / segLen;
              const cx = p1.x + dx * t;
              const cy = p1.y + dy * t;

              const dashGeo = new THREE.BoxGeometry(drawLen, stitchWidth, stitchThick);
              const dashMesh = new THREE.Mesh(dashGeo, threadMat);
              dashMesh.position.set(cx, cy, zPos + dir * (stitchThick / 2));
              dashMesh.rotation.z = angle;
              stitchGroup.add(dashMesh);
            }
            posAlongSeg += drawLen;
            accumDist += drawLen;
          } else {
            const skipLen = Math.min(stepPeriod - cyclePos, remainingInSeg);
            posAlongSeg += skipLen;
            accumDist += skipLen;
          }
        }
      }
      return stitchGroup;
    }

    function buildSideLayer(type, isFront, leatherMat, threadMat) {
      const sideGroup = new THREE.Group();
      const dir = isFront ? 1 : -1;
      const baseZ = dir * 0.045;
      const size = 100 * MM; // 100 мм = 2.6 юнита
      const cornerRadiusMm = state.cornerStyle === 'sharp' ? 2 : 10;
      const radius = cornerRadiusMm * MM;
      const stitchMargin = 2 * MM; // отступ шва от края 2 мм

      if (type === 'coin') {
        // Корпус монетницы
        const bodyH = size * 0.88;
        const bodyY = -size * 0.06;
        const bodyShape = createRoundedRectShape(size, bodyH, radius);
        const bodyGeo = new THREE.ExtrudeGeometry(bodyShape, { depth: 0.04, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.008, bevelSegments: 2 });
        const bodyMesh = new THREE.Mesh(bodyGeo, leatherMat);
        bodyMesh.position.set(0, bodyY, isFront ? baseZ : baseZ - 0.04);
        sideGroup.add(bodyMesh);

        // Клапан монетницы
        const fw = size * 0.96, fh = size * 0.46;
        const flapY = size * 0.27;
        const flapShape = new THREE.Shape();
        const topR = Math.min(radius, 5 * MM);
        flapShape.moveTo(-fw / 2, fh / 2 - topR);
        flapShape.quadraticCurveTo(-fw / 2, fh / 2, -fw / 2 + topR, fh / 2);
        flapShape.lineTo(fw / 2 - topR, fh / 2);
        flapShape.quadraticCurveTo(fw / 2, fh / 2, fw / 2, fh / 2 - topR);
        flapShape.lineTo(fw / 2, -fh * 0.1);
        flapShape.quadraticCurveTo(0, -fh * 0.75, -fw / 2, -fh * 0.1);
        flapShape.closePath();

        const flapGeo = new THREE.ExtrudeGeometry(flapShape, { depth: 0.035, bevelEnabled: true, bevelThickness: 0.008, bevelSize: 0.008, bevelSegments: 2 });
        const flapMesh = new THREE.Mesh(flapGeo, leatherMat);
        flapMesh.position.set(0, flapY, isFront ? baseZ + 0.045 : baseZ - 0.08);
        sideGroup.add(flapMesh);

        // Шов по контуру клапана (отступ 2 мм внутрь)
        const flapInner = new THREE.Shape();
        const ifw = fw - stitchMargin * 2, ifh = fh - stitchMargin * 2;
        const iTopR = Math.max(topR - stitchMargin, 0.01);
        flapInner.moveTo(-ifw / 2, ifh / 2 - iTopR);
        flapInner.quadraticCurveTo(-ifw / 2, ifh / 2, -ifw / 2 + iTopR, ifh / 2);
        flapInner.lineTo(ifw / 2 - iTopR, ifh / 2);
        flapInner.quadraticCurveTo(ifw / 2, ifh / 2, ifw / 2, ifh / 2 - iTopR);
        flapInner.lineTo(ifw / 2, -ifh * 0.1);
        flapInner.quadraticCurveTo(0, -ifh * 0.72, -ifw / 2, -ifh * 0.1);
        flapInner.closePath();

        const flapPts = flapInner.getSpacedPoints(80).map(p => ({ x: p.x, y: p.y + flapY }));
        const flapStitchZ = isFront ? baseZ + 0.045 + 0.035 + 0.008 : baseZ - 0.08 - 0.008;
        sideGroup.add(createDashedStitchMesh(flapPts, flapStitchZ, dir, threadMat));

        // Металлическая кнопка
        const snapGeo = new THREE.CylinderGeometry(0.11, 0.11, 0.02, 24);
        snapGeo.rotateX(Math.PI / 2);
        const snapMat = new THREE.MeshStandardMaterial({ color: 0x3a3a40, metalness: 0.75, roughness: 0.3 });
        const snapMesh = new THREE.Mesh(snapGeo, snapMat);
        snapMesh.position.set(0, size * 0.08, isFront ? baseZ + 0.088 : baseZ - 0.088);
        sideGroup.add(snapMesh);
      } else {
        // Карманы для карт: 2, 3 или 4 слота
        const count = parseInt(type, 10);
        for (let i = 0; i < count; i++) {
          const h = size * (0.76 - i * (0.36 / count));
          const yOffset = -(size - h) / 2;
          const zStep = i * 0.028;

          const pShape = createRoundedRectShape(size, h, radius);
          const pGeo = new THREE.ExtrudeGeometry(pShape, {
            depth: 0.026,
            bevelEnabled: true,
            bevelThickness: 0.006,
            bevelSize: 0.006,
            bevelSegments: 2
          });
          const pMesh = new THREE.Mesh(pGeo, leatherMat);
          pMesh.position.set(0, yOffset, isFront ? baseZ + zStep : baseZ - zStep - 0.026);
          sideGroup.add(pMesh);

          // Штриховой шов шириной 1 мм на расстоянии 2 мм от верхнего края кармана
          const stitchY = yOffset + h / 2 - stitchMargin;
          const halfW = size / 2 - stitchMargin;
          const topLinePts = [
            { x: -halfW, y: stitchY },
            { x: halfW, y: stitchY }
          ];
          const topStitchZ = isFront ? baseZ + zStep + 0.026 + 0.006 : baseZ - zStep - 0.026 - 0.006;
          sideGroup.add(createDashedStitchMesh(topLinePts, topStitchZ, dir, threadMat));
        }
      }

      // Периметральный штриховой шов по краю картхолдера (1 мм ширина, отступ 2 мм от края)
      const innerSize = size - stitchMargin * 2;
      const innerRadius = Math.max(radius - stitchMargin, 0.5 * MM);
      const perimShape = createRoundedRectShape(innerSize, innerSize, innerRadius);
      const perimPts = perimShape.getSpacedPoints(120);

      // Размещаем периметральный шов поверх базового слоя стороны
      const perimZ = isFront ? baseZ + 0.026 + 0.007 : baseZ - 0.026 - 0.007;
      sideGroup.add(createDashedStitchMesh(perimPts, perimZ, dir, threadMat));

      return sideGroup;
    }

    function buildEngravingMesh() {
      if (!state.engraving || !state.engravingText.trim()) return null;
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, 512, 128);
      ctx.font = 'bold 54px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = state.color.burn;
      ctx.fillText(state.engravingText.trim().toUpperCase(), 256, 64);

      const tex = new THREE.CanvasTexture(canvas);
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true });
      const geo = new THREE.PlaneGeometry(1.4, 0.35);
      const mesh = new THREE.Mesh(geo, mat);

      const yPos = state.frontType === 'coin' ? 0.65 : -0.88;
      const zPos = state.frontType === 'coin' ? 0.138 : 0.045 + parseInt(state.frontType, 10) * 0.028 + 0.012;
      mesh.position.set(0, yPos, zPos);
      return mesh;
    }

    function rebuildModel() {
      while (holderGroup.children.length > 0) {
        holderGroup.remove(holderGroup.children[0]);
      }

      const tex = createLeatherTexture(state.color.hex);
      const leatherMat = new THREE.MeshStandardMaterial({
        map: tex,
        roughness: 0.62,
        metalness: 0.05
      });
      const threadMat = new THREE.MeshStandardMaterial({ color: state.color.thread, roughness: 0.75 });

      const cornerRadiusMm = state.cornerStyle === 'sharp' ? 2 : 10;
      const coreShape = createRoundedRectShape(100 * MM, 100 * MM, cornerRadiusMm * MM);
      const coreGeo = new THREE.ExtrudeGeometry(coreShape, { depth: 0.08, bevelEnabled: true, bevelThickness: 0.01, bevelSize: 0.01, bevelSegments: 2 });
      coreGeo.center();
      const coreMesh = new THREE.Mesh(coreGeo, leatherMat);
      holderGroup.add(coreMesh);

      holderGroup.add(buildSideLayer(state.frontType, true, leatherMat, threadMat));
      holderGroup.add(buildSideLayer(state.backType, false, leatherMat, threadMat));

      const engMesh = buildEngravingMesh();
      if (engMesh) holderGroup.add(engMesh);

      updateUIState();
    }

    let targetAngleY = 0;
    let isAnimatingCamera = false;

    function setCameraSide(side) {
      document.getElementById('btn-front').classList.toggle('active', side === 'front');
      document.getElementById('btn-back').classList.toggle('active', side === 'back');
      selectSideTab(side, false);
      targetAngleY = side === 'front' ? 0 : Math.PI;
      isAnimatingCamera = true;
    }

    function selectSideTab(side, rotateCam = true) {
      state.activeTab = side;
      document.getElementById('tab-front').classList.toggle('active', side === 'front');
      document.getElementById('tab-back').classList.toggle('active', side === 'back');
      document.getElementById('active-side-label').textContent = side === 'front' ? 'Спереди' : 'Сзади';
      updateUIState();
      if (rotateCam) {
        document.getElementById('btn-front').classList.toggle('active', side === 'front');
        document.getElementById('btn-back').classList.toggle('active', side === 'back');
        targetAngleY = side === 'front' ? 0 : Math.PI;
        isAnimatingCamera = true;
      }
    }

    function setCornerStyle(style) {
      state.cornerStyle = style;
      document.getElementById('corner-label').textContent = style === 'sharp' ? 'Прямые (2 мм)' : 'Скруглённые (10 мм)';
      document.querySelectorAll('.corner-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.corner === style);
      });
      rebuildModel();
    }

    function setSideType(val) {
      if (state.activeTab === 'front') state.frontType = val;
      else state.backType = val;
      rebuildModel();
    }

    function toggleEngraving() {
      const cb = document.getElementById('engraving-check');
      state.engraving = cb.checked;
      document.getElementById('engraving-input-wrap').style.display = state.engraving ? 'block' : 'none';
      if (state.engraving) {
        setCameraSide('front');
        document.getElementById('engraving-text').focus();
      }
      rebuildModel();
    }

    function updateEngravingText() {
      state.engravingText = document.getElementById('engraving-text').value;
      rebuildModel();
    }

    function calculatePrice() {
      let price = state.basePrice;
      const sideCost = (t) => (t === 'coin' ? 15 : t === '4' ? 10 : t === '3' ? 5 : 0);
      price += sideCost(state.frontType) + sideCost(state.backType);
      if (state.engraving) price += 10;
      return price;
    }

    function updateUIState() {
      const currentVal = state.activeTab === 'front' ? state.frontType : state.backType;
      document.querySelectorAll('.opt-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.val === currentVal);
      });
      document.getElementById('total-price').textContent = calculatePrice() + ' BYN';
    }

    function submitOrder() {
      const formatSide = (t) => (t === 'coin' ? 'Монетница' : `${t} кармана`);
      const cornerName = state.cornerStyle === 'sharp' ? 'Прямые (2 мм)' : 'Скруглённые (10 мм)';
      const price = calculatePrice();
      const engInfo = state.engraving && state.engravingText.trim()
        ? `Да («${state.engravingText.trim().toUpperCase()}»)`
        : 'Нет';

      const summary = [
        'Новый заказ: Картхолдер (100×100 мм)',
        `• Цвет кожи (нить в тон): ${state.color.name}`,
        `• Углы: ${cornerName}`,
        `• Спереди: ${formatSide(state.frontType)}`,
        `• Сзади: ${formatSide(state.backType)}`,
        `• Гравировка: ${engInfo}`,
        `• Итого: ${price} BYN`
      ].join('\n');

      if (tg && tg.initData) {
        tg.sendData(JSON.stringify({
          product: 'cardholder_100x100',
          color: state.color.name,
          corners: state.cornerStyle,
          front: state.frontType,
          back: state.backType,
          engraving: state.engraving ? state.engravingText.trim().toUpperCase() : '',
          price: price
        }));
      } else {
        alert(summary);
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      if (isAnimatingCamera) {
        const currentY = holderGroup.rotation.y;
        const diff = targetAngleY - currentY;
        if (Math.abs(diff) < 0.02) {
          holderGroup.rotation.y = targetAngleY;
          isAnimatingCamera = false;
        } else {
          holderGroup.rotation.y += diff * 0.14;
        }
      }
      controls.update();
      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = wrap.clientWidth / wrap.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(wrap.clientWidth, wrap.clientHeight);
    });

    rebuildModel();
    animate();
  </script>
</body>
</html>
